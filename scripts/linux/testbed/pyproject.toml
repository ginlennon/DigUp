[project]
name = "digup-testbed-linux"
version = "0.1.0"
description = "Generators for DigUp's eval testbed on Linux (scripts/linux/make-testbed.sh)"
requires-python = "==3.13.*"
dependencies = [
    "pillow>=11",          # screenshots, text images, picture resizing
    "fonttools>=4.55",     # glyph coverage, for font fallback in screenshots
    "fpdf2>=2.8.3",        # PDFs (with text shaping through uharfbuzz for Bengali and Arabic)
    "uharfbuzz>=0.45",
    "python-docx>=1.1",    # .docx notes
    "piper-tts>=1.3",      # speech (en_US, bn_BD, ar_JO voices, CPU)
    "pypdfium2>=4.30",     # check_text.py: reads the PDFs' text layer with PDFium, as DigUp on Linux does
]

[tool.uv]
package = false
